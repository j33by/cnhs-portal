name: cnhs_portal
description: Calape National High School portal - students, teachers, parents.
publish_to: none
version: 2.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  path: ^1.9.0
  intl: ">=0.19.0 <0.21.0"
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/images/hero_school.jpg
    - assets/images/login_bg.jpg
    - assets/images/logo.jpg
