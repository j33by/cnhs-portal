name: Build apps
on:
  push: { branches: [main] }
  workflow_dispatch: {}

env:
  DEFINES: >-
    --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
    --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
    --dart-define=API_URL=${{ secrets.API_URL }}
    --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
    --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
    --dart-define=FIREBASE_SENDER_ID=${{ secrets.FIREBASE_SENDER_ID }}
    --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate the Android project (not stored in git)
        run: |
          flutter create --org io.cnhs --project-name cnhs_portal --platforms=android .
          python3 tool/patch_platforms.py android
          rm -rf test
      - run: flutter pub get
      - name: App icon (school seal)
        run: |
          rm -f flutter_launcher_icons*.yaml
          dart run flutter_launcher_icons -f tool/icons_android.yaml
      - name: Analyze (lists any code errors clearly)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true
      - run: flutter build apk --release ${{ env.DEFINES }}
      - uses: actions/upload-artifact@v4
        with: { name: cnhs-android-apk, path: app/build/app/outputs/flutter-apk/app-release.apk }

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: app, shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate the Windows project and drop Firebase (phone push is Android-only)
        run: |
          flutter create --org io.cnhs --project-name cnhs_portal --platforms=windows .
          python tool/patch_platforms.py windows
          Remove-Item -Recurse -Force test -ErrorAction SilentlyContinue
          Copy-Item lib/core/push_stub.dart lib/core/push.dart -Force
          (Get-Content pubspec.yaml) | Where-Object { $_ -notmatch '^\s+firebase_' } | Set-Content pubspec.yaml
      - run: flutter pub get
      - name: App icon (school seal)
        run: |
          Remove-Item flutter_launcher_icons*.yaml -ErrorAction SilentlyContinue
          dart run flutter_launcher_icons -f tool/icons_windows.yaml
      - name: Analyze (lists any code errors clearly)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true
      - run: flutter build windows --release ${{ env.DEFINES }}
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath cnhs-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: cnhs-windows, path: app/cnhs-windows.zip }
