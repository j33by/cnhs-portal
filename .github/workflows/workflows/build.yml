name: Build apps
on: { push: { branches: [main] }, workflow_dispatch: {} }
env:
  DEFINES: --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} --dart-define=API_URL=${{ secrets.API_URL }}
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate android/ if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org io.cnhs --project-name cnhs_portal
            python3 ../.github/scripts/patch_android.py
          fi
      - name: Write google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then echo "GOOGLE_SERVICES_JSON secret is empty"; exit 1; fi
          printf '%s' "$GSJ" > android/app/google-services.json
      - run: flutter pub get
      - run: flutter build apk --release $DEFINES
      - uses: actions/upload-artifact@v4
        with: { name: cnhs-android-apk, path: app/build/app/outputs/flutter-apk/app-release.apk }
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter config --enable-windows-desktop
      - name: Generate windows/ if missing
        shell: pwsh
        run: |
          if (-not (Test-Path windows)) {
            flutter create . --platforms=windows --org io.cnhs --project-name cnhs_portal
          }
      - run: flutter pub get
      - run: flutter build windows --release ${{ env.DEFINES }}
      - uses: actions/upload-artifact@v4
        with: { name: cnhs-windows, path: app/build/windows/x64/runner/Release }
